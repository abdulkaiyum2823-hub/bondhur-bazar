name: Unzip site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          unzip -q bondhur-bazar.zip -d /tmp/site
          cp -a /tmp/site/bondhur-bazar/. .
          rm bondhur-bazar.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract website files"
          git push
