name: Unzip site auto
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          if [ ! -f bondhur-bazar.zip ]; then echo "no zip, nothing to do"; exit 0; fi
          unzip -q bondhur-bazar.zip -d /tmp/site
          cp -a /tmp/site/bondhur-bazar/. .
          rm bondhur-bazar.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract website files"
          git push
