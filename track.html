<div class="page-head"><div class="container"><h1>অর্ডার ট্র্যাক করুন</h1></div></div>
<div class="container narrow">
  <form id="trackForm" class="form-box" novalidate>
    <p class="muted">অর্ডারের সময় পাওয়া অর্ডার নম্বর এবং অর্ডারে দেওয়া মোবাইল নম্বর দিন। দুটো না মিললে কোনো তথ্য দেখানো হবে না।</p>
    <div class="field"><label for="oid">অর্ডার নম্বর</label>
      <input class="input" id="oid" name="oid" type="text" autocomplete="off" autocapitalize="characters" placeholder="BB-261118-K7M2PX">
      <p class="err" id="err-oid" role="alert"></p></div>
    <div class="field"><label for="tphone">মোবাইল নম্বর</label>
      <input class="input" id="tphone" name="phone" type="tel" inputmode="tel" placeholder="01712345678">
      <p class="err" id="err-tphone" role="alert"></p></div>
    <button class="btn btn-lg btn-block" id="trackBtn" type="submit">অর্ডার খুঁজুন</button>
  </form>
  <div id="trackOut" aria-live="polite"></div>
