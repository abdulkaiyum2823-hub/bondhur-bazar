<body data-page="checkout">
<a class="skip-link" href="#main">মূল অংশে যান</a>
<header class="site-header" id="site-header"></header>
<main id="main">

<div class="page-head"><div class="container"><h1>চেকআউট</h1></div></div>
<div class="container"><div id="checkoutHost">
  <div class="checkout-layout">
    <form id="orderForm" class="form-box" novalidate>
      <h2>ডেলিভারির তথ্য</h2>
      <div class="form-grid">
        <div class="field"><label for="name">আপনার নাম <span class="req">*</span></label>
          <input class="input" id="name" name="name" type="text" autocomplete="name" placeholder="যেমন: রহিম উদ্দিন">
          <p class="err" id="err-name" role="alert"></p></div>
        <div class="field"><label for="phone">মোবাইল নম্বর <span class="req">*</span></label>
          <input class="input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="যেমন: 01712345678">
          <p class="err" id="err-phone" role="alert"></p></div>
        <div class="field"><label for="address">সম্পূর্ণ ঠিকানা <span class="req">*</span></label>
          <textarea class="input" id="address" name="address" autocomplete="street-address" placeholder="বাড়ি/রাস্তা/গ্রাম/এলাকা"></textarea>
          <p class="err" id="err-address" role="alert"></p></div>
        <div class="form-grid two">
          <div class="field"><label for="district">জেলা <span class="req">*</span></label>
            <select class="select" id="district" name="district"></select>
            <p class="err" id="err-district" role="alert"></p></div>
          <div class="field"><label for="upazila">উপজেলা / থানা <span class="req">*</span></label>
            <input class="input" id="upazila" name="upazila" type="text" placeholder="উপজেলা বা থানার নাম">
            <p class="err" id="err-upazila" role="alert"></p></div>
        </div>
        <div class="field"><label for="note">বিশেষ নির্দেশনা (ঐচ্ছিক)</label>
          <textarea class="input" id="note" name="note" placeholder="কিছু জানাতে চাইলে লিখুন"></textarea></div>
      </div>
      <p class="hint" id="paymentNote"></p>
      <button class="btn btn-wa btn-lg btn-block" type="submit">WhatsApp-এ অর্ডার পাঠান</button>
      <p class="hint" style="margin-top:10px">বাটনে চাপলে WhatsApp-এ আপনার অর্ডারের মেসেজ তৈরি হবে। সেখানে “Send” চাপলেই অর্ডার আমাদের কাছে পৌঁছাবে।</p>
    </form>
    <aside class="summary">
      <h2>অর্ডারের সারাংশ</h2>
      <div id="sumItems"></div>
      <div class="sum-row"><span>পণ্যের মূল্য</span><strong id="sumSub"></strong></div>
      <div class="sum-row"><span>ডেলিভারি চার্জ</span><strong id="sumDel"></strong></div>
      <div class="sum-row sum-total"><span>সর্বমোট</span><strong id="sumTotal"></strong></div>
      <a class="btn btn-outline btn-block" href="cart.html">কার্টে ফিরে যান</a>
    </aside>
  </div>
</div></div>

</main>
<footer class="site-footer" id="site-footer"></footer>
