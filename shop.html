<body data-page="shop">
<a class="skip-link" href="#main">মূল অংশে যান</a>
<header class="site-header" id="site-header"></header>
<main id="main">

<div class="page-head"><div class="container"><h1>সব পণ্য</h1></div></div>
<section class="section"><div class="container">
  <div class="shop-controls">
    <input class="input" id="q" type="search" placeholder="🔍 পণ্যের নাম লিখে খুঁজুন…" aria-label="পণ্য খুঁজুন" autocomplete="off">
    <select class="select" id="sort" aria-label="সাজান">
      <option value="default">সাজানো: সাধারণ</option>
      <option value="price-asc">দাম: কম থেকে বেশি</option>
      <option value="price-desc">দাম: বেশি থেকে কম</option>
      <option value="popular">জনপ্রিয় আগে</option>
      <option value="new">নতুন আগে</option>
    </select>
    <div class="chips" id="chips" role="group" aria-label="ক্যাটাগরি"></div>
    <div class="chips filters" id="showFilters" role="group" aria-label="বিশেষ ফিল্টার">
      <button class="chip" data-filter="popular">⭐ জনপ্রিয় পণ্য</button>
      <button class="chip" data-filter="new">🆕 নতুন পণ্য</button>
      <button class="chip" data-filter="offer">🏷️ অফার</button>
    </div>
  </div>
  <div class="result-count" id="count" aria-live="polite"></div>
  <div class="grid" id="shopGrid"></div>
</div></section>
